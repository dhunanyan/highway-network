name: Feature Request
description: Propose an enhancement to simulation behavior, architecture, or tooling.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation are you facing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your preferred approach.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you considered.
  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Links, examples, or references.
